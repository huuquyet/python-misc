<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4x4x4 3D Matrix Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f0f11;
            font-family: monospace;
            color: white;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #status {
            font-size: 16px;
            margin-top: 8px;
            color: #ff3333;
            font-weight: bold;
        }
        #top-controls {
            position: absolute;
            top: 80px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            pointer-events: auto;
        }
        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 30, 0.85);
            border: 1px solid #333;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 12px;
            min-width: 150px;
        }
        #leaderboard h3 { margin: 0 0 5px 0; font-size: 13px; color: #00ffcc; text-transform: uppercase;}
        .score-row { display: flex; justify-content: space-between; margin: 3px 0; }
        
        #controls-panel {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        button, select {
            background: #1a1a24;
            color: white;
            border: 1px solid #444;
            padding: 8px 16px;
            font-family: monospace;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 4px;
        }
        button:hover, select:hover {
            background: #00ffcc;
            color: #000;
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
        button:disabled {
            background: #0f0f13;
            color: #444;
            border-color: #222;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui">
        <h1>4x4x4 Hyper-Matrix</h1>
        <div id="status">Your Turn (Red)</div>
    </div>

    <div id="top-controls">
        <label style="line-height: 30px; font-size: 12px;">Mode: </label>
        <select id="player-count-select" onchange="changePlayerCount(this.value)">
            <option value="2">2 Players (You vs Bot A)</option>
            <option value="3" selected>3 Players (You vs 2 Bots)</option>
            <option value="4">4 Players (You vs 3 Bots)</option>
        </select>
    </div>

    <div id="leaderboard">
        <h3>Leaderboard</h3>
        <div id="scores-container"></div>
    </div>

    <div id="controls-panel">
        <button id="undo-btn" onclick="undo()">Undo</button>
        <button id="redo-btn" onclick="redo()">Redo</button>
        <button id="reset-btn" onclick="resetGame()">Reset Game</button>
    </div>

    <script>
        // --- 1. System Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(9, 9, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- 2. State & Dynamic Settings ---
        let maxPlayers = 3; 
        let board = new Array(64).fill(0); 
        let currentPlayer = 1; // 1: You (Red), 2: Bot A (Blue), 3: Bot B (Green), 4: Bot C (Yellow)
        let gameActive = true;
        const cubes = [];
        
        let historyStack = [];
        let redoStack = [];

        const spacing = 1.3;
        const geometry = new THREE.BoxGeometry(0.38, 0.38, 0.38);
        const edgesGeometry = new THREE.EdgesGeometry(geometry);

        // Construct 4x4x4 Mesh Grid
        for (let z = 0; z < 4; z++) {
            for (let y = 0; y < 4; y++) {
                for (let x = 0; x < 4; x++) {
                    const material = new THREE.MeshPhongMaterial({
                        color: 0xffffff,
                        transparent: true,
                        opacity: 0.08,
                        side: THREE.DoubleSide
                    });
                    const cube = new THREE.Mesh(geometry, material);
                    const edges = new THREE.LineSegments(edgesGeometry, new THREE.LineBasicMaterial({ color: 0x333344 }));
                    cube.add(edges);

                    cube.position.set((x - 1.5) * spacing, (y - 1.5) * spacing, (z - 1.5) * spacing);
                    cube.userData = { index: x + y * 4 + z * 16 };
                    scene.add(cube);
                    cubes.push(cube);
                }
            }
        }

        // Generate all 76 Trajectories
        const winLines = [];
        for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 4; j++) {
                winLines.push([i + j * 4 + 0 * 16, i + j * 4 + 1 * 16, i + j * 4 + 2 * 16, i + j * 4 + 3 * 16]);
                winLines.push([i + 0 * 4 + j * 16, i + 1 * 4 + j * 16, i + 2 * 4 + j * 16, i + 3 * 4 + j * 16]);
                winLines.push([0 + i * 4 + j * 16, 1 + i * 4 + j * 16, 2 + i * 4 + j * 16, 3 + i * 4 + j * 16]);
            }
            winLines.push([0 + i * 4 + 0 * 16, 1 + i * 4 + 1 * 16, 2 + i * 4 + 2 * 16, 3 + i * 4 + 3 * 16]);
            winLines.push([3 + i * 4 + 0 * 16, 2 + i * 4 + 1 * 16, 1 + i * 4 + 2 * 16, 0 + i * 4 + 3 * 16]);
            winLines.push([i + 0 * 4 + 0 * 16, i + 1 * 4 + 1 * 16, i + 2 * 4 + 2 * 16, i + 3 * 4 + 3 * 16]);
            winLines.push([i + 3 * 4 + 0 * 16, i + 2 * 4 + 1 * 16, i + 1 * 4 + 2 * 16, i + 0 * 4 + 3 * 16]);
            winLines.push([0 + 0 * 4 + i * 16, 1 + 1 * 4 + i * 16, 2 + 2 * 4 + i * 16, 3 + 3 * 4 + i * 16]);
            winLines.push([3 + 0 * 4 + i * 16, 2 + 1 * 4 + i * 16, 1 + 2 * 4 + i * 16, 0 + 3 * 4 + i * 16]);
        }
        winLines.push([0 + 0 * 4 + 0 * 16, 1 + 1 * 4 + 1 * 16, 2 + 2 * 4 + 2 * 16, 3 + 3 * 4 + 3 * 16]);
        winLines.push([3 + 0 * 4 + 0 * 16, 2 + 1 * 4 + 1 * 16, 1 + 2 * 4 + 2 * 16, 0 + 3 * 4 + 3 * 16]);
        winLines.push([0 + 3 * 4 + 0 * 16, 1 + 2 * 4 + 1 * 16, 2 + 1 * 4 + 2 * 16, 3 + 0 * 4 + 3 * 16]);
        winLines.push([3 + 3 * 4 + 0 * 16, 2 + 2 * 4 + 1 * 16, 1 + 1 * 4 + 2 * 16, 0 + 0 * 4 + 3 * 16]);

        // --- 3. Player & AI Execution Engine ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', onMouseClick);

        function onMouseClick(event) {
            if (!gameActive || currentPlayer !== 1) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(cubes);
            if (intersects.length > 0) {
                const index = intersects[0].object.userData.index;
                if (board[index] === 0) {
                    executeMove(index, 1);
                    if (gameActive && currentPlayer !== 1) {
                        setTimeout(runAiTurn, 500);
                    }
                }
            }
        }

        function executeMove(index, player) {
            historyStack.push({ board: [...board], player: player });
            redoStack = [];
            
            board[index] = player;
            updateCubeVisual(index, player);

            if (checkWinConditions()) return;
            
            currentPlayer = currentPlayer >= maxPlayers ? 1 : currentPlayer + 1;
            updateUiState();
            updateButtonStates();
        }

        function runAiTurn() {
            if (!gameActive) return;

            let targetIndex = evaluateBestMove4x4(currentPlayer);
            executeMove(targetIndex, currentPlayer);

            if (gameActive && currentPlayer !== 1) {
                setTimeout(runAiTurn, 500);
            }
        }

        function evaluateBestMove4x4(aiPlayer) {
            let opponents = Array.from({length: maxPlayers}, (_, i) => i + 1).filter(p => p !== aiPlayer);

            // Priority 1: Check Imminent AI Victory (3 marked, 1 empty)
            for (let line of winLines) {
                let aiCount = line.filter(idx => board[idx] === aiPlayer).length;
                let emptyCount = line.filter(idx => board[idx] === 0).length;
                if (aiCount === 3 && emptyCount === 1) return line.find(idx => board[idx] === 0);
            }

            // Priority 2: Block Imminent Opponent Victory
            for (let opponent of opponents) {
                for (let line of winLines) {
                    let oppCount = line.filter(idx => board[idx] === opponent).length;
                    let emptyCount = line.filter(idx => board[idx] === 0).length;
                    if (oppCount === 3 && emptyCount === 1) return line.find(idx => board[idx] === 0);
                }
            }

            // Priority 3: Strategic Setup (2 marked, 2 empty)
            for (let line of winLines) {
                let aiCount = line.filter(idx => board[idx] === aiPlayer).length;
                let emptyCount = line.filter(idx => board[idx] === 0).length;
                if (aiCount === 2 && emptyCount === 2) return line.find(idx => board[idx] === 0);
            }

            // Priority 4: Corrected 4x4x4 Fallback Preference (Core -> Corners -> Center-Faces -> Edges)
            let coreInner = [21, 22, 25, 26, 37, 38, 41, 42];
            let corners = [0, 3, 12, 15, 48, 51, 60, 63];
            let centerFaces = [5, 6, 9, 10, 17, 18, 29, 30, 33, 34, 45, 46, 20, 23, 24, 27, 36, 39, 40, 43];
            
            let combinedPref = [...coreInner, ...corners, ...centerFaces];
            for (let idx of combinedPref) {
                if (board[idx] === 0) return idx;
            }

            let available = board.map((val, idx) => val === 0 ? idx : null).filter(val => val !== null);
            return available[Math.floor(Math.random() * available.length)];
        }

        // --- 4. Validation & Local Storage Integration ---
        function checkWinConditions() {
            for (let line of winLines) {
                const [a, b, c, d] = line;
                if (board[a] !== 0 && board[a] === board[b] && board[a] === board[c] && board[a] === board[d]) {
                    gameActive = false;
                    highlightWinningVector(line);
                    
                    let winner = board[a];
                    let winnerName = winner === 1 ? "You" : `Bot ${String.fromCharCode(64 + winner - 1)}`;
                    
                    document.getElementById('status').innerText = `${winnerName} Won!`;
                    recordWinInLocalStorage(winnerName);
                    return true;
                }
            }
            if (!board.includes(0)) {
                gameActive = false;
                document.getElementById('status').innerText = "Stalemate. System Full.";
                document.getElementById('status').style.color = '#ffffff';
                return true;
            }
            return false;
        }

        function recordWinInLocalStorage(winnerName) {
            let stats = JSON.parse(localStorage.getItem('3d_tictactoe_scores') || '{}');
            stats[winnerName] = (stats[winnerName] || 0) + 1;
            localStorage.setItem('3d_tictactoe_scores', JSON.stringify(stats));
            renderLeaderboard();
        }

        function renderLeaderboard() {
            let stats = JSON.parse(localStorage.getItem('3d_tictactoe_scores') || '{}');
            let container = document.getElementById('scores-container');
            container.innerHTML = '';
            
            if (Object.keys(stats).length === 0) {
                container.innerHTML = '<div style="color:#666">No games played</div>';
                return;
            }

            for (let [player, wins] of Object.entries(stats)) {
                container.innerHTML += `<div class="score-row"><span>${player}</span><strong style="color:#00ffcc">${wins}</strong></div>`;
            }
        }

        function highlightWinningVector(line) {
            line.forEach(idx => cubes[idx].scale.set(1.4, 1.4, 1.4));
        }

        function updateCubeVisual(index, player) {
            let colors = { 0: 0xffffff, 1: 0xff3333, 2: 0x3333ff, 3: 0x33ff33, 4: 0xffff33 };
            cubes[index].material.color.setHex(colors[player]);
            cubes[index].material.opacity = player === 0 ? 0.08 : 0.85;
            if (player === 0) cubes[index].scale.set(1, 1, 1);
        }

        function updateUiState() {
            if (!gameActive) return;
            let status = document.getElementById('status');
            let colorMap = { 1: "#ff3333", 2: "#3333ff", 3: "#33ff33", 4: "#ffff33" };
            let nameMap = { 1: "Your Turn (Red)", 2: "Bot A Analyzing... (Blue)", 3: "Bot B Analyzing... (Green)", 4: "Bot C Analyzing... (Yellow)" };
            
            status.innerText = nameMap[currentPlayer];
            status.style.color = colorMap[currentPlayer];
        }

        function changePlayerCount(val) {
            maxPlayers = parseInt(val);
            resetGame();
        }

        // --- 5. Time-Travel & Resets ---
        function undo() {
            if (historyStack.length === 0 || !gameActive) return;
            redoStack.push({ board: [...board], player: currentPlayer });
            
            let previousState = historyStack.pop();
            board = previousState.board;
            currentPlayer = previousState.player;

            board.forEach((val, idx) => updateCubeVisual(idx, val));
            updateUiState();
            updateButtonStates();
            
            if (currentPlayer !== 1 && historyStack.length > 0) undo();
        }

        function redo() {
            if (redoStack.length === 0 || !gameActive) return;
            historyStack.push({ board: [...board], player: currentPlayer });
            
            let nextState = redoStack.pop();
            board = nextState.board;
            currentPlayer = nextState.player;

            board.forEach((val, idx) => updateCubeVisual(idx, val));
            updateUiState();
            updateButtonStates();
        }

        function updateButtonStates() {
            document.getElementById('undo-btn').disabled = (historyStack.length === 0);
            document.getElementById('redo-btn').disabled = (redoStack.length === 0);
        }

        function resetGame() {
            board.fill(0);
            board.forEach((val, idx) => updateCubeVisual(idx, val));
            historyStack = [];
            redoStack = [];
            currentPlayer = 1;
            gameActive = true;
            updateUiState();
            updateButtonStates();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        renderLeaderboard();
        updateButtonStates();
        animate();
    </script>
</body>
</html>
